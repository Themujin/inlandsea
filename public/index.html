<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shoreline Guard</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b1220" />
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("sg-locale");
        } catch (e) {}
        var lang = saved || ((navigator.language || "en").toLowerCase().indexOf("ar") === 0 ? "ar" : "en");
        location.replace("/" + lang + "/");
      })();
    </script>
  </head>
  <body style="background: #0b1220; color: #f4f6fb; font-family: system-ui, sans-serif">
    <p><a href="/en/" style="color: inherit">English</a> · <a href="/ar/" style="color: inherit">العربية</a></p>
  </body>
</html>
